<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="The learning loop: lesson, questions, corrections, spaced review, altitude">
  <title>The learning loop</title>
  <desc>A rising altitude curve with five stages: lesson, questions, corrections, spaced review and altitude.</desc>
  <defs>
    <linearGradient id="rise" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB6CC"/>
      <stop offset="0.55" stop-color="#3E86D6"/>
      <stop offset="1" stop-color="#0E7BEA"/>
    </linearGradient>
  </defs>

  <g stroke="#E7EDF4" stroke-width="1">
    <line x1="48" y1="286" x2="832" y2="286"/>
    <line x1="48" y1="282" x2="48" y2="290"/>
    <line x1="176" y1="283" x2="176" y2="289"/>
    <line x1="304" y1="283" x2="304" y2="289"/>
    <line x1="432" y1="283" x2="432" y2="289"/>
    <line x1="560" y1="283" x2="560" y2="289"/>
    <line x1="688" y1="283" x2="688" y2="289"/>
    <line x1="832" y1="282" x2="832" y2="290"/>
  </g>
  <text x="48" y="306" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="11" letter-spacing="2.6" fill="#93A5B8">ВЫСОТА</text>
  <text x="832" y="306" text-anchor="end" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="11" letter-spacing="2.6" fill="#93A5B8">8 848 м</text>

  <path id="route" d="M48,238 C118,234 162,212 225,205 C288,198 344,172 410,160 C476,148 532,124 600,112 C668,100 724,74 790,58"
        fill="none" stroke="url(#rise)" stroke-width="2" stroke-linecap="round"/>

  <g fill="#FFFFFF" stroke="#0E7BEA" stroke-width="2">
    <circle cx="48" cy="238" r="4.5"/>
    <circle cx="225" cy="205" r="4.5"/>
    <circle cx="410" cy="160" r="4.5"/>
    <circle cx="600" cy="112" r="4.5"/>
  </g>
  <circle cx="790" cy="58" r="5.5" fill="#0E7BEA"/>
  <circle cx="790" cy="58" r="11" fill="none" stroke="#0E7BEA" stroke-opacity="0.22"/>

  <circle r="3.4" fill="#0E7BEA">
    <animateMotion dur="11s" begin="-7s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#route" href="#route"/>
    </animateMotion>
  </circle>

  <g font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <g text-anchor="start">
      <text x="36" y="196" font-size="11" letter-spacing="2.4" fill="#9BAEC2">01</text>
      <text x="36" y="218" font-size="16" font-weight="500" fill="#0D1622">Урок</text>
    </g>
    <g text-anchor="middle">
      <text x="225" y="243" font-size="11" letter-spacing="2.4" fill="#9BAEC2">02</text>
      <text x="225" y="265" font-size="16" font-weight="500" fill="#0D1622">Вопросы</text>

      <text x="410" y="118" font-size="11" letter-spacing="2.4" fill="#9BAEC2">03</text>
      <text x="410" y="140" font-size="16" font-weight="500" fill="#0D1622">Повтор ошибок</text>

      <text x="600" y="150" font-size="11" letter-spacing="2.4" fill="#9BAEC2">04</text>
      <text x="600" y="172" font-size="16" font-weight="500" fill="#0D1622">Повторение</text>
    </g>
    <g text-anchor="end">
      <text x="800" y="86" font-size="11" letter-spacing="2.4" fill="#9BAEC2">05</text>
      <text x="800" y="108" font-size="16" font-weight="500" fill="#0D1622">Высота</text>
    </g>
  </g>
</svg>
