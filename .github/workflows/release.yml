name: Build & Release APK

# 推送 v* 标签即自动构建 debug APK 并发布 Release。
# 使用 Actions 内置的 GITHUB_TOKEN，无需任何 Personal Access Token。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/ascent-${GITHUB_REF_NAME}-debug.apk"
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: out/ascent-*-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
