name: Build & Release APK + AAB

# 推送 v* 标签即自动构建并发布 Release。
# 配置了签名 secrets 就出 release 包（R8 + 正式签名），没有则回退 debug 包并在日志里警告。
# 也支持手动触发（workflow_dispatch）：只构建 + 上传 artifact，不创建 Release，用来先验签名。
#
# 需要的 secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64     keystore 的 base64（单行，不要换行）
#   KEYSTORE_PASSWORD   keystore 口令（PKCS12 里 key 口令与库口令相同）
# 没有这两个 secret 时流水线不会失败，只是产 debug 包。
#
# Android SDK 用 GitHub-hosted runner 镜像自带的（/usr/local/lib/android/sdk）。
# 镜像不一定带我们要的版本，所以有一道「缺什么装什么」：compileSdk 36 需要
# platforms;android-36；16 KB 对齐校验需要 build-tools 35+（zipalign 的 -P 参数）。
#
# 产物两份：
#   ascent-<tag>-release.apk  侧载用（GitHub Release 附件）
#   ascent-<tag>-release.aab  Google Play 上传用（AAB 不能直接安装）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  release:
    name: Build APK + AAB and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要全部 tag：正文脚本靠 tag 判断哪些章节此前没发过版
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms dir)"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(no build-tools dir)"

      - name: Accept Android licenses
        run: |
          SM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            [ -f "$c" ] && SM="$c" && break
          done
          if [ -n "$SM" ]; then
            echo "sdkmanager: $SM"
            yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
          else
            echo "sdkmanager not found; relying on pre-accepted licenses"
          fi

      - name: Ensure SDK components
        run: |
          set -euo pipefail
          SM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            [ -f "$c" ] && SM="$c" && break
          done
          need=()
          [ -d "$ANDROID_HOME/platforms/android-36" ] || need+=("platforms;android-36")
          # zipalign 的 -P（16 KB 对齐）是 build-tools 35 才有的
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | grep -qE '^(3[5-9]|[4-9][0-9])\.' \
            || need+=("build-tools;36.1.0")
          if [ ${#need[@]} -gt 0 ]; then
            if [ -z "$SM" ]; then
              echo "::error::缺 SDK 组件但找不到 sdkmanager：${need[*]}"
              exit 1
            fi
            echo "安装：${need[*]}"
            yes 2>/dev/null | "$SM" --install "${need[@]}"
          fi
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # 密钥只落在 runner 的临时目录，构建结束（无论成败）都会删除。
      # app/build.gradle.kts 通过 ASCENT_KEYSTORE_PROPS 找这份属性文件。
      - name: Prepare signing
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ]; then
            KEYDIR="$RUNNER_TEMP/keys"
            mkdir -p "$KEYDIR"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYDIR/ascent-release.jks"
            {
              echo "storeFile=$KEYDIR/ascent-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=ascent"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > "$KEYDIR/keystore.properties"
            chmod 600 "$KEYDIR/keystore.properties" "$KEYDIR/ascent-release.jks"
            echo "ASCENT_KEYSTORE_PROPS=$KEYDIR/keystore.properties" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "签名：已从 secrets 还原 → 构建 release 包"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD，本次回退为 debug 构建"
          fi

      # Google Play 只收 AAB，所以 release 变体两个一起出：
      # AAB 给商店，APK 继续挂在 Release 上方便直接侧载。
      - name: Build APK and AAB
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p out
          V="${{ steps.signing.outputs.variant }}"
          if [ "$V" = "release" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          OUT="out/ascent-${GITHUB_REF_NAME}-${V}.apk"
          cp "$SRC" "$OUT"
          if [ "$V" = "release" ]; then
            cp app/build/outputs/bundle/release/app-release.aab \
               "out/ascent-${GITHUB_REF_NAME}-release.aab"
          fi
          ls -lh out

      # 签名必须可验证。release 包若指纹对不上（解错密钥、落到 debug 签名），
      # 直接让流水线红掉，而不是把一个装不上的包发出去。
      - name: Verify signature
        if: steps.signing.outputs.variant == 'release'
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          APK="out/ascent-${GITHUB_REF_NAME}-release.apk"
          "$APKSIGNER" verify --print-certs "$APK"
          # 期望的证书 SHA-256（2026-10-30 生成的 ascent-release.jks）
          EXPECTED="ae6cb0966256a849647b8372c24fc5edc6be876998db4eb9eef65d67a280957c"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹不符：期望 $EXPECTED，实际 $ACTUAL"
            exit 1
          fi
          echo "签名指纹校验通过：$ACTUAL"

      # Play 上架的两条硬要求，放在发版前而不是被商店退回之后再补：
      #   1. targetSdk 必须足够新（2026-08-31 起新应用与更新要求 API 36）
      #   2. 64 位原生库要能跑在 16 KB 页设备上（2027-02-01 起不兼容的更新无法发布）
      # 第二条同时查 ELF 的 p_align 和 APK 里的未压缩对齐，Filament / gltfio 是主要风险点。
      - name: Verify Play compliance (targetSdk, 16 KB pages)
        if: steps.signing.outputs.variant == 'release'
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="out/ascent-${GITHUB_REF_NAME}-release.apk"
          AAB="out/ascent-${GITHUB_REF_NAME}-release.aab"

          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" || true

          TARGET=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^targetSdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -1)
          echo "targetSdk=$TARGET"
          if [ "${TARGET:-0}" -lt 35 ]; then
            echo "::error::targetSdk $TARGET 低于 35，Play 会拒收（2026-08-31 起要求 36）"
            exit 1
          fi

          echo "--- 16 KB page compatibility ---"
          python3 tools/check_16k.py "$APK" "$AAB"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -5

      # Release 正文：只发当前 tag 的章节 + 此前未单独发版的旧版本要点，
      # 不再把整份 RELEASE_NOTES.md 贴上去（否则历史章节每版重复累积）。
      - name: Compose release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 .github/scripts/release_body.py \
            --tag "${GITHUB_REF_NAME}" \
            --notes .github/RELEASE_NOTES.md \
            --out out/release_body.md
          echo '--- 正文预览 ---'
          head -30 out/release_body.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: out/release_body.md
          files: |
            out/ascent-*.apk
            out/ascent-*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发时不发版，只把包挂到这次运行的 artifact 上，先把签名验完。
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ascent-apk
          path: |
            out/ascent-*.apk
            out/ascent-*.aab
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" || true
